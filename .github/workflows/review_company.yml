name: Review additional company

# Approve or reject a company that is not in your Excel, from the Actions tab (no local setup needed).
on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company name exactly as shown on the Companies page"
        required: true
      decision:
        description: "approve = start monitoring, reject = keep on file but never monitor"
        type: choice
        options: [approve, reject, requeue]
        default: approve

permissions:
  contents: write

concurrency:
  group: fcip-data
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          COMPANY: ${{ github.event.inputs.company }}
          DECISION: ${{ github.event.inputs.decision }}
        run: python scripts/manage_companies.py "$DECISION" "$COMPANY"
      - run: |
          git config user.name "fcip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "companies: review decision"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
