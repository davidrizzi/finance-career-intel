name: Tests

on:
  push:
    branches: [main]
    paths: ["fcip/**", "connectors/**", "scripts/**", "tests/**", "config/**", "frontend/**", "requirements*.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Python tests (offline, recorded responses)
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python scripts/build_site.py
          PW_CHANNEL=chromium node tests/e2e/site.test.mjs
