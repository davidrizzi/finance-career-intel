name: Import Excel

# Optional. Only runs if you choose to commit the Excel (see README > Updating the Excel).
# By default input/*.xlsx is git-ignored and you run scripts/import_excel.py on your computer.
on:
  push:
    branches: [main]
    paths: ["input/*.xlsx"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcip-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/import_excel.py
      - run: |
          git config user.name "fcip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: Excel import $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
